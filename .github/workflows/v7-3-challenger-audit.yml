name: V7.3 Challenger Audit
on:
  push:
    branches:
      - chatgpt/football-intelligence-foundation
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/test-challenger-state.mjs
      - run: node scripts/test-v7-boundary-strength.mjs
      - run: node scripts/run-2026-candidate-replay.mjs
