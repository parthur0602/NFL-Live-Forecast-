name: V7.3 Live Phase Integrity
on:
  push:
    branches:
      - chatgpt/football-intelligence-foundation
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/test-v7-live-phase.mjs
